<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP is injected at deploy/runtime; omitted here to avoid blocking Vite dev runtime. -->
    <title>Hound</title>
  </head>
  <body>
    <div id="boot-marker" style="padding:12px;font-family:system-ui;background:#111;color:#0f0;">
      Hound boot marker: HTML loaded
    </div>
    <script>
      (function () {
        function show(msg) {
          var pre = document.createElement("pre");
          pre.style.padding = "12px";
          pre.style.margin = "8px 12px";
          pre.style.background = "#300";
          pre.style.color = "#ffd7d7";
          pre.style.whiteSpace = "pre-wrap";
          pre.textContent = msg;
          document.body.appendChild(pre);
        }
        window.addEventListener("error", function (e) {
          show("HTML boot caught error:\n" + (e.error && e.error.stack ? e.error.stack : e.message));
        });
        window.addEventListener("unhandledrejection", function (e) {
          var reason = e.reason && e.reason.stack ? e.reason.stack : String(e.reason || "unknown");
          show("HTML boot caught rejection:\n" + reason);
        });
        setTimeout(function () {
          var root = document.getElementById("root");
          if (root && root.children.length === 0) {
            show("App did not mount into #root within 2s. Module likely failed before React render.");
          }
        }, 2000);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
